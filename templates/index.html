<!DOCTYPE html>
<html>
<head>
    <title>Happy Birthday Madam Garu ❤️</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        img {
            width: 280px;
            height: 280px;
            object-fit: cover;
            border-radius: 20px;
        }

        h1 {
            color: #e91e63;
            font-size: 40px;
        }

        button {
            padding: 14px 25px;
            border: none;
            border-radius: 25px;
            background: #e91e63;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #c2185b;
        }
    </style>
</head>

<body>

    <div class="card">

        <img src="{{ url_for('static', filename='birthday.jpg') }}">

        <h1>🎂 Happy Birthday Madam Garu🎉</h1>

        <p>To my wonderful best friend ❤️</p>

        <a href="/friendship">
            <button>Click Here💝</button>
        </a>

    </div>

</body>
</html>
